<h1>Forms</h1>
<h3>{{mensaje}}</h3>
<form #idform="ngForm" (ngSubmit)="recibirDatos()">
    <label for="nombre">Nombre: </label>
    <input type="text"[(ngModel)]="user.nombre" #cajanombre="ngModel">
    <label for="nombre">Apellidos: </label>
    <input type="text"[(ngModel)]="user.apellidos" #cajaapellidos="ngModel">
    <label for="nombre">Edad: </label>
    <input type="text"[(ngModel)]="user.edad" #cajaedad="ngModel">
    <button>mandar</button>
</form>
<h2>Nombre: {{user.Nombre}} Apellidos: {{user.apellidos}} Edad: {{user.edad}}</h2>
